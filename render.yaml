databases:
  - name: doc2sdk-db
    databaseName: doc2sdk
    user: doc2sdk
    plan: free
    region: ohio

services:
  # Backend: Python FastAPI Service
  - type: web
    name: doc2sdk-backend
    env: python
    region: ohio
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt && pip install uvicorn gunicorn json_repair
    startCommand: cd backend && alembic upgrade head && gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: doc2sdk-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://doc2sdk-frontend.onrender.com

  # Frontend: React Static Site
  - type: web
    name: doc2sdk-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://doc2sdk-backend.onrender.com/api
