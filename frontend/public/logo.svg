<svg width="320" height="120" viewBox="0 10 320 100" fill="none"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F5A623" />
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F5A623" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ICON: Stacked layers -->
  <!-- Bottom layer -->
  <rect x="20" y="70" width="68" height="18" rx="6"
        fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>

  <!-- Middle layer -->
  <rect x="15" y="50" width="68" height="18" rx="6"
        fill="#202025" stroke="#52525B" stroke-width="1.5"/>

  <!-- Top layer -->
  <rect x="10" y="30" width="68" height="18" rx="6"
        fill="#27272E" stroke="#F5A623" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- Lightning bolt -->
  <path d="M63 32 L48 58 H61 L45 90 L75 54 H61 Z"
        fill="url(#amberGrad)" filter="url(#amberGlow)"/>

  <!-- Divider -->
  <line x1="104" y1="30" x2="104" y2="90"
        stroke="rgba(255, 255, 255, 0.18)" stroke-width="2" stroke-linecap="round"/>

  <!-- TEXT -->
  <text x="124" y="72"
        font-size="34"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="800"
        letter-spacing="-0.02em">
    <tspan fill="#F9FAFB">Doc</tspan><tspan fill="#F5A623">2SDK</tspan>
  </text>
</svg>
